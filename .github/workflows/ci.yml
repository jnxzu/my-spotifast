name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_GENERATOR: Ninja

jobs:
  test:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GLEW for libprojectM
        run: vcpkg install glew:x64-windows-static
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: test-v1
      - name: Dependency sources
        run: python .github/scripts/check-dependency-sources.py
      - name: Review evidence policy
        run: python .github/scripts/check-review-evidence.py
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: mbx clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: mbx test --locked --all-targets
      - name: Build Windows app
        run: mbx build --locked
      - name: Windows app artifact
        uses: actions/upload-artifact@v6
        with:
          name: spotifast-j-windows-x64
          path: target/debug/spotifast.exe
          if-no-files-found: error
          retention-days: 7
